<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Membership Packages | PTL Performance</title>

    <link rel="stylesheet" href="style.css">

    <style>
        .membership-page {
            min-height: 100vh;
            background: #0d0d0d;
            color: white;
            padding: 140px 20px 80px;
            text-align: center;
        }

        .membership-container {
            width: min(1100px, 100%);
            margin: 0 auto;
        }

        .membership-page h1 {
            font-size: clamp(2.8rem, 7vw, 5rem);
            margin-bottom: 15px;
        }

        .membership-intro {
            max-width: 700px;
            margin: 0 auto 40px;
            color: #cccccc;
            line-height: 1.7;
        }

        .pricing-guide {
            display: block;
            width: 100%;
            max-width: 950px;
            height: auto;
            margin: 0 auto 40px;
            border-radius: 12px;
        }

        .membership-actions {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .membership-button {
            display: inline-block;
            padding: 15px 26px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 700;
        }

        .primary-membership-button {
            background: #7ac943;
            color: #0d0d0d;
        }

        .secondary-membership-button {
            border: 1px solid white;
            color: white;
        }
    </style>
</head>

<body>
    <main class="membership-page">
        <div class="membership-container">

            <h1>Membership Packages</h1>

            <p class="membership-intro">
                Explore PTL Performance membership options designed to support
                purposeful training, athletic development, recovery, and
                continued progress.
            </p>

            <img
                class="pricing-guide"
                src="images/membership-packages.png"
                alt="PTL Performance membership packages and included services"
            >

            <div class="membership-actions">
                <a
                    class="membership-button primary-membership-button"
                    href="index.html#contact"
                >
                    Book Your Assessment
                </a>

                <a
                    class="membership-button secondary-membership-button"
                    href="index.html#services"
                >
                    Back to Services
                </a>
            </div>

        </div>
    </main>
</body>
</html>
